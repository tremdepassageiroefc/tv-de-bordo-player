name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Renomear APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/*.apk saida/tv-de-bordo-${{ github.run_number }}.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-de-bordo-apk
          path: saida/*.apk
